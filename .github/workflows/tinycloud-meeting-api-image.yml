name: tinycloud-meeting-api-image

on:
  push:
    branches: [tinycloud]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: tinycloud-meeting-api-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: meeting-api
            directory: core/meetings/services/meeting-api
          - component: gateway
            directory: core/gateway/services/gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The meeting-api contract suite executes the real TypeScript attributed-audio recorder.
      # Install its pinned workspace toolchain before pytest exercises that cross-runtime seam.
      - uses: pnpm/action-setup@v4
        if: matrix.component == 'meeting-api'
      - uses: actions/setup-node@v4
        if: matrix.component == 'meeting-api'
        with: { node-version: 22, cache: pnpm }
      - name: Install recorder workspace dependencies
        if: matrix.component == 'meeting-api'
        run: pnpm install --frozen-lockfile
        env: { ONNXRUNTIME_NODE_INSTALL: skip }

      - name: Test ${{ matrix.component }}
        working-directory: ${{ matrix.directory }}
        run: |
          set -euo pipefail
          python -m pip install uv==0.9.22
          uv run --locked pytest tests -q

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.component }}
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          IMAGE="ghcr.io/tinycloudlabs/vexa/${{ matrix.component }}:tc-${SHORT_SHA}"
          DOCKER_BUILDKIT=1 docker build \
            -f "${{ matrix.directory }}/Dockerfile" \
            --label "org.opencontainers.image.source=https://github.com/TinyCloudLabs/vexa" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "Published ${IMAGE}"
